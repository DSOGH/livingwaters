<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Work Order Vault Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">
      <h1>Work Order Vault</h1>
      <span class="badge">PRO</span>
    </div>
    <button class="btn-icon" onclick="toggleSettings()">⚙️</button>
  </header>

  <!-- Settings -->
  <div id="settingsCard" class="card hidden slide-down">
    <label>Google Gemini API Key</label>
    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
    <div class="action-row">
      <button class="btn-primary" onclick="saveApiKey()">Save Key</button>
      <button class="btn-secondary" onclick="toggleSettings()">Close</button>
    </div>
  </div>

  <!-- Scanner Button -->
  <div class="card scan-card">
    <label for="cameraInput" class="btn-scan">
      <span class="icon">📷</span> Scan New Work Order
    </label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processImage(event)">
  </div>

  <div id="statusMsg" class="hidden status-pulse">Analyzing document & calculating totals...</div>

  <!-- Main Editor -->
  <div id="editorCard" class="card hidden fade-in">
    <form id="orderForm" onsubmit="handleSaveInitiation(event)">
      <input type="hidden" id="f_paper_total"> <!-- Tracks what the AI read as the final total -->
      
      <div class="section-header">Customer Info</div>
      <div class="grid">
        <div><label>Date</label><input type="text" id="f_date"></div>
        <div><label>Phone</label><input type="tel" id="f_phone"></div>
        <div class="full"><label>Name / Property</label><input type="text" id="f_name"></div>
        <div class="full"><label>Address</label><input type="text" id="f_address"></div>
      </div>

      <div class="section-header">Parts & Materials</div>
      <table id="partsTable">
        <thead><tr><th width="15%">Qty</th><th width="60%">Description</th><th width="25%">Amount</th></tr></thead>
        <tbody id="partsBody"></tbody>
      </table>
      <button type="button" class="btn-dashed" onclick="addPartRow()">+ Add Part</button>

      <div class="section-header">Labor Performed</div>
      <table id="laborTable">
        <thead><tr><th width="75%">Description</th><th width="25%">Amount</th></tr></thead>
        <tbody id="laborBody"></tbody>
      </table>
      <button type="button" class="btn-dashed" onclick="addLaborRow()">+ Add Labor</button>

      <div class="section-header">Notes</div>
      <textarea id="f_notes" rows="2" placeholder="Add any specific details, warnings, or customer requests here..."></textarea>

      <div class="section-header">Totals</div>
      <div class="grid">
        <div><label>Total Materials</label><input type="number" step="0.01" id="f_tot_materials" readonly class="readonly"></div>
        <div><label>Total Labor</label><input type="number" step="0.01" id="f_tot_labor" readonly class="readonly"></div>
        <div><label>Tax</label><input type="number" step="0.01" id="f_tax" oninput="calculateMath()"></div>
        <div><label>Trip Fee</label><input type="number" step="0.01" id="f_trip" oninput="calculateMath()"></div>
        <div class="full"><label>Calculated Grand Total</label><input type="number" step="0.01" id="f_grand_total" readonly class="readonly grand-total"></div>
      </div>

      <div class="action-row" style="margin-top: 1.5rem;">
        <button type="submit" class="btn-primary" style="flex: 2;">💾 Save Order</button>
        <button type="button" class="btn-secondary" style="flex: 1;" onclick="cancelEdit()">Discard</button>
      </div>
    </form>
  </div>

  <!-- Discrepancy Modal (Overlay) -->
  <div id="discrepancyModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="color: #ef4444; margin-top: 0;">⚠️ Total Mismatch</h3>
      <p style="font-size: 0.9rem; color: var(--muted);">
        The app calculated <strong>$<span id="calcTotalDisplay"></span></strong> based on the items, 
        but the paper says <strong>$<span id="paperTotalDisplay"></span></strong>.
      </p>
      <label>Reason for discrepancy (required):</label>
      <input type="text" id="f_discrepancy_reason" placeholder="e.g., Forgot to write tax, math error on paper..." required>
      <div class="action-row" style="margin-top: 1rem;">
        <button class="btn-primary" onclick="confirmDiscrepancySave()">Acknowledge & Save</button>
        <button class="btn-secondary" onclick="closeDiscrepancyModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="history-header">
    <h2>Stored Orders</h2>
    <button class="btn-outline" onclick="exportCSV()">📥 Export CSV</button>
  </div>
  <div id="savedList"></div>

  <script src="app.js"></script>
</body>
</html>
